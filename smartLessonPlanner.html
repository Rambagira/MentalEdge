<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Adsense ads -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9666115145226151"
     crossorigin="anonymous"></script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Language Lesson Plan Generator</title>
    <style>
        /* --- CSS STYLES --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 40px 20px;
            color: #333;
        }
        
        .container { max-width: 1200px; margin: 0 auto; }
        
        /* HEADER */
        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            color: white;
        }
        
        .header h1 { margin-bottom: 5px; }
        .header p { opacity: 0.9; font-size: 1.1em; }
        
        /* FORM CONTAINER */
        .form-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }
        
        .section-title {
            grid-column: 1 / -1;
            font-size: 1.2em;
            color: #1e3c72;
            margin: 25px 0 15px 0;
            border-bottom: 2px solid #eee;
            padding-bottom: 5px;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }
        
        .form-group { display: flex; flex-direction: column; }
        .form-group.full-width { grid-column: 1 / -1; }
        
        label { font-weight: 600; margin-bottom: 5px; color: #555; font-size: 0.9em; }
        label.required::after { content: " *"; color: red; }
        
        input, select, textarea {
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1em;
            width: 100%;
        }
        
        input:focus, select:focus, textarea:focus { border-color: #2a5298; outline: none; }
        
        /* Language Selector Highlight */
        #language {
            background-color: #f0f9ff;
            border-color: #2a5298;
            font-weight: bold;
            color: #1e3c72;
        }
        
        .generate-btn {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 16px 40px;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 30px;
            transition: transform 0.2s;
        }
        
        .generate-btn:hover { transform: translateY(-2px); }
        
        /* OUTPUT AREA */
        .result-container {
            background: white;
            border-radius: 15px;
            padding: 40px;
            display: none;
        }
        
        .result-container.show { display: block; }

        .controls {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin: 0 5px;
            color: white;
            font-size: 1em;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-print { background: #555; }
        .btn-word { background: #0078d4; }
        .btn:hover { opacity: 0.9; }

        /* PREVIEW STYLES */
        .lesson-plan-wrapper {
            margin-bottom: 40px;
            padding: 20px;
            border: 1px dashed #ccc;
        }
        
        .lesson-plan {
            font-family: 'Times New Roman', serif;
            font-size: 11pt;
            color: black;
            line-height: 1.3;
        }
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
        td { border: 1px solid black; padding: 5px; vertical-align: top; }
        .bold { font-weight: bold; }
        ul { padding-left: 20px; margin: 5px 0; }
        .text-center { text-align: center; }
        
        /* PRINT MODE */
        @media print {
            body { background: white; padding: 0; }
            .header, .form-container, .controls { display: none !important; }
            .result-container { padding: 0; margin: 0; box-shadow: none; }
            .lesson-plan-wrapper { border: none; padding: 0; margin: 0; }
            .page-break { page-break-after: always; display: block; height: 1px; }
            .lesson-plan-wrapper:last-child .page-break { page-break-after: auto; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🌍 Multi-Language Lesson Generator</h1>
            <p>English • Français • Kinyarwanda • Kiswahili</p>
        </div>

        <div class="form-container">
            <form id="lessonForm">
                <div class="form-grid">
                    
                    <div class="form-group full-width">
                        <label class="required">Select Lesson Plan Language / Hitamo Ururimi / Choisir la Langue</label>
                        <select id="language" required>
                            <option value="en">English (Default)</option>
                            <option value="fr">Français (French)</option>
                            <option value="rw">Kinyarwanda</option>
                            <option value="sw">Kiswahili</option>
                        </select>
                    </div>

                    <h3 class="section-title">🏫 Class & Subject Details</h3>
                    
                    <div class="form-group">
                        <label class="required">Subject / Isomo</label>
                        <input type="text" id="subject" placeholder="e.g. Mathematics / Imibare" required>
                    </div>

                    <div class="form-group">
                        <label class="required">Class / Icyiciro</label>
                        <input type="text" id="class" placeholder="e.g. P4" required>
                    </div>

                    <div class="form-group">
                        <label class="required">Class Size</label>
                        <input type="number" id="classSize" placeholder="45" required>
                    </div>

                    <div class="form-group">
                        <label class="required">Duration (min)</label>
                        <input type="number" id="duration" value="40" required>
                    </div>
                    
                    <h3 class="section-title">👤 Teacher Info</h3>

                    <div class="form-group">
                        <label class="required">School Name / Izina ry'ishuri</label>
                        <input type="text" id="schoolName" placeholder="G.S. ..." required>
                    </div>

                    <div class="form-group">
                        <label class="required">Teacher's Name</label>
                        <input type="text" id="teacherName" required>
                    </div>

                    <div class="form-group">
                        <label class="required">Term / Igihembwe</label>
                        <select id="term" required>
                            <option value="1">I</option>
                            <option value="2">II</option>
                            <option value="3">III</option>
                        </select>
                    </div>

                    <h3 class="section-title">📚 Unit Planning</h3>

                    <div class="form-group">
                        <label class="required">Unit No</label>
                        <input type="number" id="unitNo" placeholder="1" required>
                    </div>

                    <div class="form-group full-width">
                        <label class="required">Unit Title / Umutwe w'Umutwe</label>
                        <input type="text" id="unitTitle" required>
                    </div>

                    <div class="form-group">
                        <label class="required">Start Date</label>
                        <input type="date" id="startDate" required>
                    </div>

                    <div class="form-group">
                        <label class="required">Start Lesson No</label>
                        <input type="number" id="startLessonNo" value="1" required>
                    </div>

                    <div class="form-group full-width">
                        <label class="required">Lesson Titles (One per line) / Imitwe y'amasomo</label>
                        <textarea id="lessonTitlesList" rows="6" placeholder="1. Introduction to topic&#10;2. Specific concepts&#10;3. Practice exercises&#10;4. Review and Assessment" required></textarea>
                        <small style="color: #666;">Each line generates one full lesson plan.</small>
                    </div>

                    <div class="form-group full-width">
                        <label class="optional">Special Needs / References</label>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                            <input type="text" id="specialNeeds" placeholder="SNE Info">
                            <input type="text" id="references" placeholder="References / Ibitabo byifashishijwe">
                        </div>
                    </div>

                </div>
                <button type="submit" class="generate-btn">✨ Generate / Hanga</button>
            </form>
        </div>

        <div id="resultContainer" class="result-container">
            <div class="controls">
                <button class="btn btn-word" onclick="exportToWord()">💾 Download Word (.doc)</button>
                <button class="btn btn-print" onclick="window.print()">🖨️ Print / PDF</button>
            </div>
            
            <div id="masterOutput" contenteditable="true"></div>
        </div>
    </div>

    <script>
        // --- TRANSLATION DICTIONARY ---
        const DICTIONARY = {
            en: {
                title: "LESSON PLAN",
                school: "School Name", teacher: "Teacher", term: "Term", date: "Date",
                subject: "Subject", class: "Class", unitNo: "Unit N°", lessonNo: "Lesson N°",
                duration: "Duration", classSize: "Class size",
                sne: "Special Educational Needs", unitTitle: "Unit Title",
                keyComp: "Key Unit Competence", lessonTitle: "Lesson Title",
                obj: "Instructional Objective", plan: "Plan for this Class",
                materials: "Learning Materials", refs: "References",
                timing: "Timing", tAct: "Teacher Activities", lAct: "Learner Activities", comp: "Competences",
                intro: "Introduction", dev: "Development", conc: "Conclusion", selfEval: "Self Evaluation",
                
                // Content Generation
                termPrefix: "Term",
                min: "min",
                noSne: "No specific needs identified.",
                keyCompText: "To use concepts of [UNIT] in solving daily life problems.",
                objText: "By the end of the lesson, learners will be able to explain and apply concepts of [TOPIC] correctly.",
                planText: "Classroom setting, learners arranged in mixed-ability groups.",
                defaultMat: "Textbooks, Manila paper, markers, chalkboard",
                
                // Activities
                actIntroT: ["Greets the class.", "Reviews previous lesson.", "Introduces new topic: [TOPIC]."],
                actIntroL: ["Responding to greeting.", "Answering review questions.", "Listening to introduction."],
                actDevT: ["Explains the concept of [TOPIC].", "Demonstrates examples on the board.", "Assigns group tasks.", "Supervises group work."],
                actDevL: ["Observing demonstration.", "Working in groups.", "Asking questions.", "Presenting findings."],
                actConcT: ["Asks learners to summarize.", "Gives evaluation exercise.", "Assigns homework."],
                actConcL: ["Summarizing key points.", "Doing evaluation.", "Copying homework."],
                competenceText: "Communication, Critical Thinking, Cooperation."
            },
            
            fr: {
                title: "FICHE DE LEÇON",
                school: "Nom de l'école", teacher: "Enseignant", term: "Trimestre", date: "Date",
                subject: "Sujet", class: "Classe", unitNo: "Unité N°", lessonNo: "Leçon N°",
                duration: "Durée", classSize: "Taille de la classe",
                sne: "Besoins Éducatifs Spéciaux", unitTitle: "Titre de l'Unité",
                keyComp: "Compétence Clé", lessonTitle: "Titre de la Leçon",
                obj: "Objectif Instructionnel", plan: "Plan de la classe",
                materials: "Matériel Didactique", refs: "Références",
                timing: "Minutage", tAct: "Activités de l'Enseignant", lAct: "Activités de l'Apprenant", comp: "Compétences",
                intro: "Introduction", dev: "Développement", conc: "Conclusion", selfEval: "Auto-évaluation",

                termPrefix: "Trimestre",
                min: "min",
                noSne: "Aucun besoin spécifique identifié.",
                keyCompText: "Utiliser les concepts de [UNIT] pour résoudre des problèmes quotidiens.",
                objText: "À la fin de la leçon, les apprenants seront capables d'expliquer et d'appliquer les concepts de [TOPIC] correctement.",
                planText: "Disposition de la classe, apprenants en groupes mixtes.",
                defaultMat: "Manuels, papier Manille, marqueurs, tableau noir",

                actIntroT: ["Salue la classe.", "Fait la révision de la leçon précédente.", "Introduit le nouveau sujet : [TOPIC]."],
                actIntroL: ["Répondent aux salutations.", "Répondent aux questions de révision.", "Écoutent l'introduction."],
                actDevT: ["Explique le concept de [TOPIC].", "Démontre des exemples au tableau.", "Donne des tâches de groupe.", "Supervise le travail de groupe."],
                actDevL: ["Observent la démonstration.", "Travaillent en groupes.", "Posent des questions.", "Présentent les résultats."],
                actConcT: ["Demande aux apprenants de résumer.", "Donne un exercice d'évaluation.", "Donne des devoirs."],
                actConcL: ["Résument les points clés.", "Font l'évaluation.", "Copient les devoirs."],
                competenceText: "Communication, Pensée Critique, Coopération."
            },

            rw: {
                title: "ITEGURAMASOMO",
                school: "Izina ry'ishuri", teacher: "Umwarimu", term: "Igihembwe", date: "Itariki",
                subject: "Isomo", class: "Icyiciro", unitNo: "Umutwe N°", lessonNo: "Isomo N°",
                duration: "Igihe", classSize: "Umubare w'abanyeshuri",
                sne: "Abafite ubumuga", unitTitle: "Umutwe w'Umutwe",
                keyComp: "Ubushobozi Nyamukuru", lessonTitle: "Umutwe w'Isomo",
                obj: "Intego y'isomo", plan: "Imiterere y'ishuri",
                materials: "Imfashanyigisho", refs: "Ibitabo byifashishijwe",
                timing: "Igihe", tAct: "Ibikorwa by'Umwarimu", lAct: "Ibikorwa by'Umunyeshuri", comp: "Ubushobozi",
                intro: "Intangiriro", dev: "Igice Nyamukuru", conc: "Umusozo", selfEval: "Isuzumabumenyi",

                termPrefix: "Igihembwe cya",
                min: "min",
                noSne: "Nta bafite ubumuga bihari.",
                keyCompText: "Gukoresha ubumenyi bwa [UNIT] mu gukemura ibibazo byo mu buzima.",
                objText: "Ku iherezo ry'isomo, abanyeshuri bazaba bashobora gusobanura no gukoresha neza ibyize kuri [TOPIC].",
                planText: "Abanyeshuri bicaye mu matsinda avanze.",
                defaultMat: "Ibitabo, impapuro za manila, makambo, ikibaho",

                actIntroT: ["Asuhuza abanyeshuri.", "Asubiramo isomo ry'ubushize.", "Atangiza isomo rishya: [TOPIC]."],
                actIntroL: ["Bikikiriza umwarimu.", "Basubiza ibibazo by'isubiramo.", "Batega amatwi inkomoko y'isomo."],
                actDevT: ["Asobanura [TOPIC] akoresheje ingero.", "Yerekana uko bikorwa ku kibaho.", "Atanga imirimo yo mu matsinda.", "Akulina imirimo y'amatsinda."],
                actDevL: ["Bakurikira ibisobanuro.", "Bakorera mu matsinda.", "babaza ibibazo.", "Bamurika ibyo bagezeho."],
                actConcT: ["Abaza abanyeshuri incamake.", "Atanga umwitozo wo kwisuzuma.", "Atanga umukoro wo mu rugo."],
                actConcL: ["Bavuga incamake y'isomo.", "Bakora umwitozo.", "Bandika umukoro."],
                competenceText: "Itumanaho, Gutekereza cyane, Ubufatanye."
            },

            sw: {
                title: "ANDALIO LA SOMO",
                school: "Jina la Shule", teacher: "Mwalimu", term: "Muhula", date: "Tarehe",
                subject: "Somo", class: "Darasa", unitNo: "Sura N°", lessonNo: "Somo N°",
                duration: "Muda", classSize: "Idadi ya Wanafunzi",
                sne: "Mahitaji Maalum", unitTitle: "Jina la Sura",
                keyComp: "Umahiri Mkuu", lessonTitle: "Mada ya Somo",
                obj: "Lengo la Somo", plan: "Mpango wa Darasa",
                materials: "Vifaa vya Kufundishia", refs: "Marejeleo",
                timing: "Muda", tAct: "Shughuli za Mwalimu", lAct: "Shughuli za Mwanafunzi", comp: "Umahiri",
                intro: "Utangulizi", dev: "Kiini cha Somo", conc: "Hitimisho", selfEval: "Tathmini Binafsi",

                termPrefix: "Muhula wa",
                min: "dakika",
                noSne: "Hakuna mahitaji maalum yaliyoainishwa.",
                keyCompText: "Kutumia dhana za [UNIT] kutatua matatizo ya maisha ya kila siku.",
                objText: "Kufikia mwisho wa somo, mwanafunzi aweze kueleza na kutumia dhana za [TOPIC] kwa usahihi.",
                planText: "Mpangilio wa darasa, wanafunzi wakiwa katika makundi mchanganyiko.",
                defaultMat: "Vitabu, karatasi za manila, kalamu, ubao",

                actIntroT: ["Anawasalimu wanafunzi.", "Anarudia somo lililopita.", "Anatambulisha mada mpya: [TOPIC]."],
                actIntroL: ["Wanakubali salamu.", "Wanajibu maswali ya marudio.", "Wanasikiliza utambulisho wa somo."],
                actDevT: ["Anaelezea dhana ya [TOPIC].", "Anaonyesha mifano ubaoni.", "Anatoa kazi za makundi.", "Anasimamia kazi za makundi."],
                actDevL: ["Wanaangalia mifano.", "Wanafanya kazi katika makundi.", "Wanauliza maswali.", "Wanawasilisha majibu."],
                actConcT: ["Anawaomba wanafunzi kutoa muhtasari.", "Anatoa zoezi la tathmini.", "Anatoa kazi ya nyumbani."],
                actConcL: ["Wanatoa muhtasari.", "Wanafanya zoezi.", "Wanaandika kazi ya nyumbani."],
                competenceText: "Mawasiliano, Fikra Tunduizi, Ushirikiano."
            }
        };

        // --- SETUP DEFAULTS ---
        document.getElementById('startDate').valueAsDate = new Date();

        function getNextSchoolDay(currentDate) {
            let next = new Date(currentDate);
            next.setDate(next.getDate() + 1);
            while (next.getDay() === 0 || next.getDay() === 6) {
                next.setDate(next.getDate() + 1);
            }
            return next;
        }

        function formatDate(d) {
            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const year = d.getFullYear();
            return `${day}/${month}/${year}`;
        }

        // --- SMART MATERIALS (LANGUAGE AWARE) ---
        function getMaterials(title, langKey) {
            const t = title.toLowerCase();
            let mats = DICTIONARY[langKey].defaultMat;
            
            // Note: This logic basically checks English keywords in the title 
            // but appends localized material names if matches are found.
            // For a robust system, we assume titles are input in the target language 
            // OR we provide generic lists. Here we stick to the default list + specific tools based on simple heuristics.
            
            if (t.includes("geometry") || t.includes("geo") || t.includes("ishusho")) {
                const tools = {
                    en: ", geometric set, ruler, compass",
                    fr: ", ensemble de géométrie, règle, compas",
                    rw: ", ibikoresho byo gushushanya, rula, compas",
                    sw: ", vifaa vya jiometri, rula, bikari"
                };
                mats += tools[langKey];
            }
            return mats;
        }

        // --- GENERATION ENGINE ---
        document.getElementById('lessonForm').addEventListener('submit', function(e) {
            e.preventDefault();
            generatePlans();
        });

        function generatePlans() {
            // 1. Detect Language
            const langKey = document.getElementById('language').value;
            const dict = DICTIONARY[langKey];

            // 2. Get Inputs
            const school = document.getElementById('schoolName').value;
            const teacher = document.getElementById('teacherName').value;
            const termRaw = document.getElementById('term').value;
            const term = `${dict.termPrefix} ${termRaw}`;
            const subject = document.getElementById('subject').value;
            const className = document.getElementById('class').value;
            const classSize = document.getElementById('classSize').value;
            const duration = document.getElementById('duration').value;
            const unitNo = document.getElementById('unitNo').value;
            const unitTitle = document.getElementById('unitTitle').value;
            const sne = document.getElementById('specialNeeds').value || dict.noSne;
            const ref = document.getElementById('references').value || "Rwanda Curriculum";

            let currentDate = new Date(document.getElementById('startDate').value);
            let lessonNo = parseInt(document.getElementById('startLessonNo').value);
            
            const titlesRaw = document.getElementById('lessonTitlesList').value;
            const titles = titlesRaw.split('\n').filter(t => t.trim() !== '');
            const totalLessons = titles.length + (lessonNo - 1); 

            let htmlOutput = "";

            titles.forEach((title) => {
                const cleanTitle = title.replace(/^\d+[\.\)]\s*/, '');
                
                // Dynamic Text Replacement
                const obj = dict.objText.replace("[TOPIC]", cleanTitle);
                const keyComp = dict.keyCompText.replace("[UNIT]", unitTitle);
                const mat = getMaterials(cleanTitle, langKey);
                
                // Build Lists for Activities
                const renderList = (arr) => {
                    return `<ul>` + arr.map(item => `<li>${item.replace("[TOPIC]", cleanTitle)}</li>`).join('') + `</ul>`;
                };

                htmlOutput += `
                <div class="lesson-plan-wrapper">
                    <div class="lesson-plan">
                        <div class="text-center bold" style="font-size: 14pt; margin-bottom: 10px; text-transform: uppercase;">${dict.title}</div>
                        
                        <div style="margin-bottom: 5px; font-size: 11pt;">
                            <span class="bold">${dict.school}:</span> ${school}
                            <span style="float: right;" class="bold">${dict.teacher}: ${teacher}</span>
                        </div>

                        <table>
                            <tr style="background: #f0f0f0;">
                                <td class="bold">${dict.term}</td>
                                <td class="bold">${dict.date}</td>
                                <td class="bold">${dict.subject}</td>
                                <td class="bold">${dict.class}</td>
                                <td class="bold">${dict.unitNo}</td>
                                <td class="bold">${dict.lessonNo}</td>
                                <td class="bold">${dict.duration}</td>
                                <td class="bold">${dict.classSize}</td>
                            </tr>
                            <tr>
                                <td>${term}</td>
                                <td>${formatDate(currentDate)}</td>
                                <td>${subject}</td>
                                <td>${className}</td>
                                <td>${unitNo}</td>
                                <td>${lessonNo} / ${totalLessons}</td>
                                <td>${duration} ${dict.min}</td>
                                <td>${classSize}</td>
                            </tr>
                        </table>

                        <table>
                            <tr>
                                <td class="bold" style="width: 30%;">${dict.sne}</td>
                                <td>${sne}</td>
                            </tr>
                            <tr>
                                <td class="bold">${dict.unitTitle}</td>
                                <td>${unitTitle}</td>
                            </tr>
                            <tr>
                                <td class="bold">${dict.keyComp}</td>
                                <td>${keyComp}</td>
                            </tr>
                            <tr>
                                <td class="bold">${dict.lessonTitle}</td>
                                <td>${cleanTitle}</td>
                            </tr>
                            <tr>
                                <td class="bold">${dict.obj}</td>
                                <td>${obj}</td>
                            </tr>
                            <tr>
                                <td class="bold">${dict.plan}</td>
                                <td>${dict.planText}</td>
                            </tr>
                            <tr>
                                <td class="bold">${dict.materials}</td>
                                <td>${mat}</td>
                            </tr>
                            <tr>
                                <td class="bold">${dict.refs}</td>
                                <td>${ref}</td>
                            </tr>
                        </table>

                        <table>
                            <tr style="background: #f0f0f0;">
                                <td class="bold" style="width: 15%;">${dict.timing}</td>
                                <td class="bold" style="width: 28%;">${dict.tAct}</td>
                                <td class="bold" style="width: 28%;">${dict.lAct}</td>
                                <td class="bold" style="width: 29%;">${dict.comp}</td>
                            </tr>
                            <tr>
                                <td class="bold">${dict.intro}<br>(5 ${dict.min})</td>
                                <td>${renderList(dict.actIntroT)}</td>
                                <td>${renderList(dict.actIntroL)}</td>
                                <td>${dict.competenceText}</td>
                            </tr>
                            <tr>
                                <td class="bold">${dict.dev}<br>(${parseInt(duration)-15} ${dict.min})</td>
                                <td>${renderList(dict.actDevT)}</td>
                                <td>${renderList(dict.actDevL)}</td>
                                <td>${dict.competenceText}</td>
                            </tr>
                            <tr>
                                <td class="bold">${dict.conc}<br>(10 ${dict.min})</td>
                                <td>${renderList(dict.actConcT)}</td>
                                <td>${renderList(dict.actConcL)}</td>
                                <td>${dict.competenceText}</td>
                            </tr>
                            <tr>
                                <td class="bold">${dict.selfEval}</td>
                                <td colspan="3" style="color: #888; height: 50px;">...</td>
                            </tr>
                        </table>
                    </div>
                    <div class="page-break"></div>
                </div>`;

                lessonNo++;
                currentDate = getNextSchoolDay(currentDate);
            });

            document.getElementById('masterOutput').innerHTML = htmlOutput;
            const container = document.getElementById('resultContainer');
            container.classList.add('show');
            container.scrollIntoView({ behavior: 'smooth' });
        }

        // --- WORD EXPORT ---
        function exportToWord() {
            var content = document.getElementById('masterOutput').innerHTML;
            var header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Lesson Plans</title><style>body{font-family:'Times New Roman';font-size:11pt}table{width:100%;border-collapse:collapse;margin-bottom:10px}td{border:1px solid black;padding:5px;vertical-align:top}.bold{font-weight:bold}.text-center{text-align:center}.page-break{page-break-after:always}</style></head><body>";
            var footer = "</body></html>";
            var sourceHTML = header + content + footer;
            
            var source = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(sourceHTML);
            var fileDownload = document.createElement("a");
            document.body.appendChild(fileDownload);
            fileDownload.href = source;
            fileDownload.download = 'Lesson_Plans.doc';
            fileDownload.click();
            document.body.removeChild(fileDownload);
        }
    </script>
</body>
</html>
